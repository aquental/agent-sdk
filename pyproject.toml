[project]
name = "agent-sdk"
version = "0.1.0"
description = "Agent SDK study project"
readme = "README.md"
authors = [
    { name = "Antonio Quental", email = "antonio.quental@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
]

[project.scripts]
agent-sdk = "agent_sdk.cli:main"
agents = "agents.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
